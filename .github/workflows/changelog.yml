name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Generate changelog locally
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-message: "chore(release): {version} [skip ci]"
          preset: angular
          tag-prefix: "v"
          output-file: "CHANGELOG.md"
          version-file: package.json
          skip-on-empty: "true"
          skip-version-file: "false"
          skip-commit: "true"
          skip-tag: "true"
          git-push: "false"
          create-summary: "true"

      - name: Create changelog branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="chore/auto-changelog"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "chore(release): update changelog [skip ci]"
            git push origin "$BRANCH" --force
            echo "Changelog branch pushed: $BRANCH"
          else
            echo "No changes to commit"
          fi
